# Weather block — hourly Open-Meteo low-wind forecast collector.

enabled: true
key_prefix: weather:openmeteo:jeri
refresh_interval: 1h
cache_ttl: 240h
low_wind_max_knots: 12
# Optional gust gate. Leave 0/empty to filter only by wind_speed_10m.
low_gust_max_knots: 0

open_meteo:
  base_url: https://api.open-meteo.com/v1/forecast
  latitude: -2.795
  longitude: -40.514
  forecast_days: 7
  wind_speed_unit: kn
  timezone: auto
