# AI block — operation-level provider routing.

enabled: true

providers:
  openai:
    driver: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    default_model: gpt-4o-mini
    timeout: 30s

  local:
    driver: local

routes:
  translation:
    default: openai
    operations:
      detect: local
      translate: openai

  chat:
    default: openai
