# Appkit BaseConfig reference — documents shared YAML nodes for every application.
# Used by config package tests and as a template for product config files.
#
# Expected GET /config JSON (secrets redacted): testdata/base.example.json
#
# Products embed BaseConfig (mapstructure:",squash") and add their own nodes
# (trip, posts, …). Env overrides use your product prefix, e.g. VIA_JERI_DATABASE_HOST.

app:
  name: example api

log:
  level: info
  format: json

server:
  http:
    enabled: true
    addr: ":8080"
  grpc:
    enabled: true
    addr: ":9090"
  websocket:
    enabled: false
    addr: ""

database:
  host: localhost
  port: 5432
  user: app
  password: secret
  name: app
  sslmode: disable

nats:
  url: nats://localhost:4222

redis:
  enabled: false
  addr: localhost:6379
  password: ""
  db: 0

migrations:
  path: db/migrations

# Optional appkit blocks — wire in runtime when enabled: true
accounts:
  enabled: false
  config_path: config/accounts.yaml
  frontend_url: https://app.example.com
  api_public_url: https://api.example.com
  registration_enabled: true
  register_as_admin: false
  skip_email_verification: false
  oauth:
    enabled: false
    google:
      enabled: false
    facebook:
      enabled: false
    apple:
      enabled: false

currency:
  enabled: false
  schema: currency
  base_currency: USD
  currencies:
    - USD
    - EUR
  api_url: https://api.frankfurter.dev/v1/latest
  update_interval: 1h

language:
  enabled: false
  schema: language
  default_language: en
  languages:
    - en
    - pt

ai:
  enabled: false

weather:
  enabled: false
  key_prefix: weather:openmeteo:jeri
  refresh_interval: 1h
  cache_ttl: 240h
  low_wind_max_knots: 12
  open_meteo:
    base_url: https://api.open-meteo.com/v1/forecast
    latitude: -2.795
    longitude: -40.514
    forecast_days: 7
    wind_speed_unit: kn
    timezone: auto

permissions:
  enabled: false
  schema: account
  default_profile: member

email:
  from: noreply@example.com
  brand: Example
  smtp:
    host: ""
    port: 0
    username: ""
    password: ""

tenants:
  enabled: false
  config_path: config/tenants.yaml

mail_provisioning:
  enabled: false
  jmap_url: ""
  domain_id: ""
  mail_domain: ""
